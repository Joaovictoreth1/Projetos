<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/shared/accessible.css" />
    <link rel="stylesheet" href="./src/calculadora/style.css" />
    <script type="module" src="./src/calculadora/main.js"></script>
  </head>
  <body>
    <main class="calculadora" aria-label="Calculadora">
      <input
        type="text"
        id="display"
        aria-label="Visor da calculadora"
        aria-live="polite"
        readonly
      />
      <p id="resultado" class="sr-only" role="status"></p>
      <div class="botoes" id="botoes">
        <button type="button" value="Escape" aria-label="Limpar (C)">C</button>
        <button type="button" value="/" class="operador">/</button>
        <button type="button" value="*" class="operador">*</button>
        <button
          type="button"
          value="Backspace"
          class="operador"
          aria-label="Apagar (Del)"
        >
          Del
        </button>
        <button type="button" value="7">7</button>
        <button type="button" value="8">8</button>
        <button type="button" value="9">9</button>
        <button type="button" value="-" class="operador">-</button>
        <button type="button" value="4">4</button>
        <button type="button" value="5">5</button>
        <button type="button" value="6">6</button>
        <button type="button" value="+" class="operador">+</button>
        <button type="button" value="1">1</button>
        <button type="button" value="2">2</button>
        <button type="button" value="3">3</button>
        <button type="button" value=".">.</button>
        <button type="button" value="0">0</button>
        <button type="button" value="=" class="igual">=</button>
      </div>
    </main>
  </body>
</html>
