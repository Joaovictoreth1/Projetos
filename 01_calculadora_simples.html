<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; font-family: sans-serif; margin: 0; }
        .calculadora { background: #333; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #display { width: 100%; height: 50px; background: #222; color: #0f0; text-align: right; font-size: 24px; border: none; margin-bottom: 10px; border-radius: 5px; padding: 5px; box-sizing: border-box; }
        .botoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; background: #eee; transition: 0.2s; }
        button:hover { background: #ccc; }
        .operador { background: #ff9800; color: white; }
        .operador:hover { background: #e68a00; }
        .igual { grid-column: span 4; background: #4caf50; color: white; }
        .igual:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="calculadora">
        <input type="text" id="display" disabled>
        <div class="botoes">
            <button onclick="limpar()">C</button>
            <button onclick="inserir('/')"
                class="operador">/</button>
            <button onclick="inserir('*')"
                class="operador">*</button>
            <button onclick="apagar()" class="operador">Del</button>
            <button onclick="inserir('7')">7</button>
            <button onclick="inserir('8')">8</button>
            <button onclick="inserir('9')">9</button>
            <button onclick="inserir('-')"
                class="operador">-</button>
            <button onclick="inserir('4')">4</button>
            <button onclick="inserir('5')">5</button>
            <button onclick="inserir('6')">6</button>
            <button onclick="inserir('+')"
                class="operador">+</button>
            <button onclick="inserir('1')">1</button>
            <button onclick="inserir('2')">2</button>
            <button onclick="inserir('3')">3</button>
            <button onclick="inserir('.')">.</button>
            <button onclick="inserir('0')">0</button>
            <button onclick="calcular()"
                class="igual">=</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function inserir(valor) { display.value += valor; }
        function limpar() { display.value = ''; }
        function apagar() { display.value = display.value.slice(0, -1); }
        function calcular() {
            try { display.value = eval(display.value); } 
            catch { display.value = 'Erro'; setTimeout(limpar, 1000); }
        }
    </script>
</body>
</html>
