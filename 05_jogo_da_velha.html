<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #2c3e50; color: white; margin: 0; }
        .tabuleiro { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; background: #34495e; padding: 5px; border-radius: 5px; }
        .celula { width: 100px; height: 100px; background: #ecf0f1; color: #2c3e50; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; cursor: pointer; }
        .celula:hover { background: #bdc3c7; }
        h1 { margin-bottom: 10px; }
        #status { font-size: 20px; margin-bottom: 20px; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 16px; background: #e74c3c; border: none; color: white; border-radius: 5px; cursor: pointer; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h1>Jogo da Velha</h1>
    <div id="status">Vez do X</div>
    <div class="tabuleiro" id="tabuleiro"></div>
    <button onclick="reiniciar()">Reiniciar Jogo</button>

    <script>
        const tabuleiroElement = document.getElementById('tabuleiro');
        const statusElement = document.getElementById('status');
        let tabuleiro = ['', '', '', '', '', '', '', '', ''];
        let jogadorAtual = 'X';
        let jogoAtivo = true;

        const condicoesVitoria = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        function criarTabuleiro() {
            tabuleiroElement.innerHTML = '';
            tabuleiro.forEach((celula, index) => {
                const div = document.createElement('div');
                div.classList.add('celula');
                div.addEventListener('click', () => jogar(index));
                div.textContent = celula;
                tabuleiroElement.appendChild(div);
            });
        }

        function jogar(index) {
            if (tabuleiro[index] !== '' || !jogoAtivo) return;
            tabuleiro[index] = jogadorAtual;
            verificarVitoria();
            if(jogoAtivo) {
                jogadorAtual = jogadorAtual === 'X' ? 'O' : 'X';
                statusElement.textContent = `Vez do ${jogadorAtual}`;
            }
            criarTabuleiro();
        }

        function verificarVitoria() {
            let venceu = false;
            for (let i = 0; i < condicoesVitoria.length; i++) {
                const [a, b, c] = condicoesVitoria[i];
                if (tabuleiro[a] && tabuleiro[a] === tabuleiro[b] && tabuleiro[a] === tabuleiro[c]) {
                    venceu = true;
                    break;
                }
            }
            if (venceu) {
                statusElement.textContent = `Jogador ${jogadorAtual} Venceu!`;
                jogoAtivo = false;
            } else if (!tabuleiro.includes('')) {
                statusElement.textContent = 'Deu Velha!';
                jogoAtivo = false;
            }
        }

        function reiniciar() {
            tabuleiro = ['', '', '', '', '', '', '', '', ''];
            jogadorAtual = 'X';
            jogoAtivo = true;
            statusElement.textContent = 'Vez do X';
            criarTabuleiro();
        }

        criarTabuleiro();
    </script>
</body>
</html>
