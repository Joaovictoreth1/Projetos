<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerador de Senhas</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/senhas/style.css" />
    <script type="module" src="./src/senhas/main.js"></script>
  </head>
  <body>
    <main class="box">
      <h1>Gerador de Senhas</h1>
      <div class="senha-display" id="senha">…</div>
      <div class="tamanho">
        <label for="slider">Tamanho: <span id="valor-tamanho">12</span></label>
        <input type="range" id="slider" min="6" max="30" value="12" />
      </div>
      <fieldset id="tipos">
        <legend>Tipos de caracteres</legend>
        <label
          ><input type="checkbox" value="upper" checked /> Maiúsculas</label
        >
        <label
          ><input type="checkbox" value="lower" checked /> Minúsculas</label
        >
        <label><input type="checkbox" value="digits" checked /> Números</label>
        <label
          ><input type="checkbox" value="symbols" checked /> Símbolos</label
        >
      </fieldset>
      <button type="button" id="gerar">Gerar Senha</button>
      <button type="button" id="copiar" disabled>Copiar</button>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
