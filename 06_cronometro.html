<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a202c; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .container { text-align: center; background: #2d3748; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .tempo { font-size: 60px; font-weight: bold; margin-bottom: 30px; font-variant-numeric: tabular-nums; }
        .botoes button { padding: 10px 20px; font-size: 16px; margin: 0 5px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        .btn-iniciar { background: #48bb78; } .btn-iniciar:hover { background: #38a169; }
        .btn-pausar { background: #ed8936; } .btn-pausar:hover { background: #dd6b20; }
        .btn-zerar { background: #e53e3e; } .btn-zerar:hover { background: #c53030; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tempo" id="display">00:00:00</div>
        <div class="botoes">
            <button class="btn-iniciar" onclick="iniciar()">Iniciar</button>
            <button class="btn-pausar" onclick="pausar()">Pausar</button>
            <button class="btn-zerar" onclick="zerar()">Zerar</button>
        </div>
    </div>
    <script>
        let timer;
        let horas = 0, minutos = 0, segundos = 0;
        let rodando = false;

        function atualizarDisplay() {
            const f = (val) => val < 10 ? `0${val}` : val;
            document.getElementById('display').textContent = `${f(horas)}:${f(minutos)}:${f(segundos)}`;
        }

        function iniciar() {
            if (!rodando) {
                rodando = true;
                timer = setInterval(() => {
                    segundos++;
                    if (segundos == 60) { segundos = 0; minutos++; }
                    if (minutos == 60) { minutos = 0; horas++; }
                    atualizarDisplay();
                }, 1000);
            }
        }

        function pausar() {
            rodando = false;
            clearInterval(timer);
        }

        function zerar() {
            rodando = false;
            clearInterval(timer);
            horas = 0; minutos = 0; segundos = 0;
            atualizarDisplay();
        }
    </script>
</body>
</html>
