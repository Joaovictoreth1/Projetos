<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cronômetro</title>
    <link rel="stylesheet" href="./src/cronometro/style.css" />
    <script type="module" src="./src/cronometro/main.js"></script>
  </head>
  <body>
    <main class="container" aria-label="Cronômetro">
      <div class="tempo" id="display" role="timer">00:00:00</div>
      <div class="botoes">
        <button type="button" class="btn-iniciar" id="iniciar">Iniciar</button>
        <button type="button" class="btn-pausar" id="pausar" disabled>
          Pausar
        </button>
        <button type="button" class="btn-zerar" id="zerar" disabled>
          Zerar
        </button>
      </div>
    </main>
  </body>
</html>
