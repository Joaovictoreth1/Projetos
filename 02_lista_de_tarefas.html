<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de Tarefas</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/shared/accessible.css" />
    <link rel="stylesheet" href="./src/tarefas/style.css" />
    <script type="module" src="./src/tarefas/main.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>Minhas Tarefas</h1>
      <form id="form-tarefa" class="input-group">
        <label class="sr-only" for="nova-tarefa">Nova tarefa</label>
        <input
          type="text"
          id="nova-tarefa"
          placeholder="Adicione uma tarefa..."
        />
        <button type="submit">Adicionar</button>
      </form>
      <p id="status" role="status"></p>
      <ul id="lista"></ul>
    </main>
  </body>
</html>
