<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tarefas</title>
  <link rel="stylesheet" href="tasks.css">
</head>
<body>
  <main>
    <a href="index.html">← Todos os exercícios</a>
    <h1>Minhas tarefas</h1>
    <p>Monte sua lista e marque o que já terminou. As tarefas ficam neste navegador.</p>

    <form id="task-form" class="task-form">
      <label for="new-task">Nova tarefa</label>
      <div class="form-row">
        <input type="text" id="new-task" required maxlength="120" placeholder="Ex.: estudar JavaScript">
        <button type="submit">Adicionar</button>
      </div>
    </form>

    <div class="toolbar">
      <div role="group" aria-label="Filtrar tarefas">
        <button type="button" data-filter="all" aria-pressed="true">Todas</button>
        <button type="button" data-filter="active" aria-pressed="false">Pendentes</button>
        <button type="button" data-filter="done" aria-pressed="false">Concluídas</button>
      </div>
      <p id="task-summary"></p>
    </div>

    <p id="task-storage" role="status" hidden></p>
    <div class="task-notice">
      <p id="task-feedback" role="status" class="feedback"></p>
      <button type="button" id="undo-task" hidden>Desfazer última exclusão</button>
    </div>
    <p id="task-empty" class="empty">Sua lista está vazia.</p>
    <ul id="task-list" aria-label="Tarefas"></ul>
    <noscript><p>Ative o JavaScript para adicionar e marcar tarefas.</p></noscript>
  </main>
  <script type="module" src="tasks.mjs"></script>
</body>
</html>
